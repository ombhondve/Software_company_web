name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run tests (fails if coverage < 80%)
        run: pytest

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t task-api:ci .
      - name: Enforce image size limit (150 MB)
        run: |
          SIZE=$(docker image inspect task-api:ci --format '{{.Size}}')
          echo "Image size: $((SIZE / 1024 / 1024)) MB"
          test "$SIZE" -le $((150 * 1024 * 1024))
